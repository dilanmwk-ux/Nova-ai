<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101b18">
<title>Nova — AI Chat</title>
<style>
:root{color-scheme:dark;--bg:#101b18;--sidebar:#0c1513;--panel:#182521;--panel2:#20312b;--line:#2b3c35;--text:#f0f1e9;--muted:#a1afa5;--accent:#9ed6bd;--accent2:#d4e7ad;--user:#23372f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.65 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,textarea{font:inherit}
.app{min-height:100dvh;display:flex}.sidebar{width:264px;flex-shrink:0;background:var(--sidebar);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 13px;transition:transform .22s}.brandrow{display:flex;align-items:center;justify-content:space-between;padding:0 7px 24px}.brand{display:flex;align-items:center;gap:10px;font-weight:720;font-size:18px;letter-spacing:-.4px}.mark{width:29px;height:29px;display:grid;place-items:center;color:#10221b;background:var(--accent);border-radius:9px;font-size:17px}.iconbtn{border:0;background:transparent;color:var(--muted);cursor:pointer;border-radius:9px;padding:8px;display:grid;place-items:center}.iconbtn:hover{background:var(--panel2);color:var(--text)}.newchat{width:100%;border:1px solid #42574b;background:transparent;color:var(--text);border-radius:11px;padding:10px 12px;text-align:left;cursor:pointer;display:flex;align-items:center;gap:9px}.newchat:hover{background:var(--panel)}.side-label{font-size:11px;text-transform:uppercase;letter-spacing:1.1px;color:#809188;padding:24px 9px 9px}.history{color:var(--muted);font-size:13px;padding:9px;border-radius:8px}.sidebottom{margin-top:auto;border-top:1px solid var(--line);padding:14px 8px 2px;color:var(--muted);font-size:12px}.profile{display:flex;gap:9px;align-items:center;margin-top:12px;color:var(--text);font-size:13px}.profileicon{width:30px;height:30px;border-radius:50%;background:#30483d;display:grid;place-items:center;color:var(--accent2)}
.main{min-width:0;flex:1;display:flex;flex-direction:column;height:100dvh}.topbar{height:62px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 25px;border-bottom:1px solid #23342d}.top-title{font-size:14px;color:#dce4dc;display:flex;gap:7px;align-items:center}.model-pill{display:flex;align-items:center;gap:8px;border:1px solid var(--line);padding:5px 10px;border-radius:12px;font-size:12px;color:var(--muted)}.status-profile{display:flex;align-items:center;gap:9px}.status-profile img{width:32px;height:32px;border-radius:50%;object-fit:cover;border:1px solid var(--accent)}.online{font-size:12px;color:#8ee6a8;font-weight:600}.mainarea{flex:1;min-height:0;overflow-y:auto;scroll-behavior:smooth}.inner{width:min(760px,100%);margin:0 auto;padding:30px 25px 24px}.welcome{padding:clamp(40px,11vh,110px) 0 25px}.welcome h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(31px,4.4vw,43px);font-weight:500;letter-spacing:-1.2px;line-height:1.2;margin:0 0 13px}.welcome h1 span{color:var(--accent)}.welcome p{margin:0;color:var(--muted);font-size:15px}.suggestions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:29px}.suggestion{min-height:83px;text-align:left;background:#15211d;border:1px solid #2a3c33;color:var(--text);border-radius:13px;padding:13px 15px;cursor:pointer;transition:.16s}.suggestion:hover{border-color:#668c77;background:#1b2b24}.suggestion strong{display:block;font-size:13px;font-weight:600}.suggestion small{display:block;font-size:12px;color:var(--muted);margin-top:4px}
#messages{display:flex;flex-direction:column;gap:28px;padding:12px 0 26px}.msg{display:flex;gap:13px;align-items:flex-start}.avatar{flex:0 0 29px;height:29px;border-radius:50%;display:grid;place-items:center;background:#273a30;color:var(--accent);font-size:14px;margin-top:2px}.msg.user .avatar{background:#3c4c41;color:#e6edda}.msgbody{min-width:0;flex:1}.speaker{font-size:12px;font-weight:650;color:#d5dfd5;margin-bottom:5px}.bubble{white-space:pre-wrap;overflow-wrap:anywhere;color:#e8ece5}.msg.user .bubble{background:var(--user);border:1px solid #30483b;border-radius:13px;padding:10px 13px;display:inline-block;max-width:100%}.meta{font-size:11px;color:#81958a;margin-top:9px}.typing{color:var(--muted);font-size:13px;margin:0 0 14px 42px}.composerzone{flex-shrink:0;padding:12px 20px 18px;background:linear-gradient(0deg,var(--bg) 75%,transparent)}.composerwrap{max-width:710px;margin:0 auto}.composer{display:flex;align-items:flex-end;gap:10px;padding:11px 11px 10px 15px;border:1px solid #43564a;background:#1a2923;border-radius:18px;box-shadow:0 8px 32px #0002}.composer:focus-within{border-color:#81b99d}.composer textarea{flex:1;resize:none;max-height:170px;min-height:32px;border:0;outline:0;background:transparent;color:var(--text);padding:4px 0;font:inherit;line-height:1.5}.composer textarea::placeholder{color:#91a097}.send{height:37px;width:37px;flex:0 0 37px;border:0;border-radius:11px;background:var(--accent);color:#10251b;font-size:21px;font-weight:700;cursor:pointer}.send:hover{background:var(--accent2)}.send:disabled{opacity:.45;cursor:wait}.disclaimer{text-align:center;color:#829187;font-size:11px;margin-top:9px}.mobile-menu{display:none}
@media(max-width:760px){.sidebar{position:fixed;z-index:5;inset:0 auto 0 0;transform:translateX(-105%);box-shadow:20px 0 50px #0005}.sidebar.open{transform:translateX(0)}.mobile-menu{display:grid}.topbar{padding:0 14px}.inner{padding:20px 17px}.composerzone{padding:9px 12px 13px}.welcome{padding-top:55px}.suggestions{grid-template-columns:1fr 1fr;gap:8px}.suggestion{padding:11px;min-height:88px}.model-pill{display:none}}
@media(max-width:410px){.suggestions{grid-template-columns:1fr}.welcome{padding-top:35px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brandrow"><div class="brand"><span class="mark"><svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M12 2l1.8 7.1L21 12l-7.2 1.8L12 22l-1.8-8.2L3 12l7.2-2.9L12 2z" fill="currentColor"/></svg></span> nova</div><button class="iconbtn" id="closeSide" aria-label="Tutup menu">‹</button></div>
  <button class="newchat" id="newchat"><span>＋</span> Chat baru</button>
  <div class="side-label">Terbaru</div>
  <div class="history">✦ &nbsp; Percakapan baru</div>
  <div class="sidebottom">
    <div>AI assistant · Personal workspace</div>
    <div class="profile"><div class="profileicon">N</div><div><strong>Nova AI</strong><br><span style="color:var(--muted);font-size:11px">Powered by API</span></div></div>
  </div>
</aside>
<section class="main">
  <header class="topbar">
    <div style="display:flex;align-items:center;gap:8px"><button class="iconbtn mobile-menu" id="openSide" aria-label="Buka menu">☰</button><div class="top-title">Nova <span style="color:var(--muted)">⌄</span></div></div>
    <div class="model-pill"><div class="status-profile"><img src="https://files.catbox.moe/w5eyrv.jpg" alt="Profile"></div><span class="online">● Online</span></div>
  </header>
  <div class="mainarea" id="mainarea">
    <div class="inner">
      <section class="welcome" id="welcome">
        <h1>Selamat datang kembali.<br><span>Apa yang ada di pikiranmu?</span></h1>
        <p>Tanya, eksplorasi ide, atau mulai sesuatu yang baru.</p>
        <div class="suggestions" id="suggestions">
          <button class="suggestion" data-prompt="Jelaskan apa itu black hole secara singkat"><strong>🌌 Jelajahi alam semesta</strong><small>Jelaskan black hole dengan sederhana</small></button>
          <button class="suggestion" data-prompt="Bantu saya membuat jadwal belajar yang efektif"><strong>📚 Susun rencana belajar</strong><small>Buat jadwal yang realistis dan efektif</small></button>
          <button class="suggestion" data-prompt="Berikan 5 ide proyek website untuk pemula"><strong>💡 Temukan ide baru</strong><small>Ide proyek website untuk pemula</small></button>
          <button class="suggestion" data-prompt="Ajari saya JavaScript dari dasar dengan contoh"><strong>⌘ Belajar coding</strong><small>Mulai JavaScript dari dasar</small></button>
        </div>
      </section>
      <section id="messages" aria-live="polite"></section>
      <div id="typing" class="typing" hidden><svg> Nova sedang menyusun jawaban…</div>
    </div>
  </div>
  <div class="composerzone">
    <div class="composerwrap">
      <form class="composer" id="chat-form">
        <textarea id="prompt" rows="1" placeholder="Kirim pesan ke Nova…" aria-label="Pesan" required></textarea>
        <button class="send" id="send" aria-label="Kirim pesan" title="Kirim">↑</button>
      </form>
      <div class="disclaimer">Nova bisa keliru. Periksa kembali informasi penting.</div>
    </div>
  </div>
</section>
</div>
<script>
(() => {
 const form=document.querySelector('#chat-form'),input=document.querySelector('#prompt'),messages=document.querySelector('#messages'),send=document.querySelector('#send'),typing=document.querySelector('#typing'),welcome=document.querySelector('#welcome'),suggestions=document.querySelector('#suggestions'),mainarea=document.querySelector('#mainarea'),sidebar=document.querySelector('#sidebar');
 let session=localStorage.getItem('nova-session');
 if(!session){session='nova-'+(crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2));localStorage.setItem('nova-session',session)}
 let busy=false;
 function addMessage(role,text,meta=''){
  const row=document.createElement('article');row.className='msg '+role;
  const avatar=document.createElement('div');avatar.className='avatar';avatar.innerHTML=role==='user'?'<svg width="14" height="14" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" fill="currentColor"/><path d="M4 21c0-4 3.5-7 8-7s8 3 8 7" fill="currentColor"/></svg>':'<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.2 7.1L22 12l-7.8 2.1L12 22l-2.2-7.9L2 12l7.8-2.9L12 2z"/></svg>';
  const body=document.createElement('div');body.className='msgbody';
  const speaker=document.createElement('div');speaker.className='speaker';speaker.textContent=role==='user'?'Kamu':'Nova';
  const bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=text;
  body.append(speaker,bubble);
  if(meta){const m=document.createElement('div');m.className='meta';m.textContent=meta;body.append(m)}
  row.append(avatar,body);messages.append(row);setTimeout(()=>row.scrollIntoView({behavior:'smooth',block:'end'}),20);return bubble;
 }
 async function ask(text){
  text=text.trim();if(!text||busy)return;
  welcome.hidden=true;addMessage('user',text);input.value='';input.style.height='auto';busy=true;send.disabled=true;typing.hidden=false;sidebar.classList.remove('open');
  try{
   const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({teks:text,model:'chatgpt',session,stream:false})});
   const data=await r.json().catch(()=>({}));
   if(!r.ok||data.status===false)throw new Error(data.message||data.error||'Permintaan gagal. Coba lagi.');
   const answer=data.result||data.answer||data.response||data.message;
   if(typeof answer!=='string'||!answer.trim())throw new Error('API tidak memberikan jawaban yang bisa ditampilkan.');
   const meta=[data.model,data.usage&&('Token: '+data.usage.total_tokens)].filter(Boolean).join(' · ');
   addMessage('assistant',answer,meta);
  }catch(e){addMessage('assistant','Maaf, pesan belum berhasil diproses. '+(e.message||'Periksa koneksi lalu coba lagi.'))}
  finally{busy=false;send.disabled=false;typing.hidden=true;input.focus()}
 }
 form.addEventListener('submit',e=>{e.preventDefault();ask(input.value)});
 input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,170)+'px'});
 input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit()}});
 document.querySelectorAll('[data-prompt]').forEach(b=>b.addEventListener('click',()=>ask(b.dataset.prompt)));
 document.querySelector('#newchat').addEventListener('click',()=>{messages.replaceChildren();welcome.hidden=false;sidebar.classList.remove('open');input.focus()});
 document.querySelector('#openSide').addEventListener('click',()=>sidebar.classList.add('open'));
 document.querySelector('#closeSide').addEventListener('click',()=>sidebar.classList.remove('open'));
})();
</script>
</body>
</html>
